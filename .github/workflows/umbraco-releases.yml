name: New Umbraco releases

# Looks each Monday for new releases of the Umbraco major versions the package supports, and runs the tests on those
# releases only. A release that passes is added to UmbracoReleases on main, and the weekly release publishes a package
# for it. A release that fails gets an issue. The jobs come from auroris/AurorisNet.Build, whose docs/releasing.md
# describes them.
on:
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:
    inputs:
      releases:
        description: Releases to test instead of the new ones, separated by commas, such as 18.3.2,17.8.2
        required: false
        default: ''
      dry-run:
        description: Show the results in the run only, without a commit or an issue
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: umbraco-releases
  cancel-in-progress: false

jobs:
  umbraco:
    uses: auroris/AurorisNet.Build/.github/workflows/umbraco-releases.yml@main
    permissions:
      actions: write
      contents: write
      issues: write
    with:
      runs-on: ubuntu-latest
      submodules: true
      # The site tests boot a real Umbraco site with SQLite, with the draw.io submodule checked out.
      test-command: dotnet test --project tests/AurorisNet.Umbraco.Drawio.Tests -c Release "-p:UmbracoVersion=$env:UMBRACO_RELEASE"
      releases: ${{ inputs.releases || '' }}
      dry-run: ${{ inputs.dry-run || false }}
