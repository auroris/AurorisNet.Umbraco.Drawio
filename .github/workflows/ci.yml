name: CI

# Tests each pull request on the newest supported Umbraco release, and merges a Dependabot update that passes. Other
# Umbraco releases are tested on a developer's machine, as the README's Developing section describes.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      with_virtual_path_fix:
        description: Also test both editors with ApplicationVirtualPathFix installed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    name: Test
    # Linux checks out draw.io's files with their own line endings, as the Release workflow does.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ContinuousIntegrationBuild: 'true'
    steps:
      # The draw.io submodule comes at its pinned commit, with one commit of history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: true
          persist-credentials: false

      # global.json keeps the build on a .NET 10 SDK, whichever other SDKs the runner has.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Test backoffice adapters
        run: node --test tests/backoffice/media-api.test.mjs

      - name: Test
        run: dotnet test --project tests/AurorisNet.Umbraco.Drawio.Tests -c Release

      - name: Pack
        run: |
          foreach ($project in @('src/AurorisNet.Umbraco.Drawio.csproj', 'selfhosted/AurorisNet.Umbraco.Drawio.Selfhosted.csproj')) {
            dotnet pack $project -c Release -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { throw "Could not pack $project." }
          }

      - name: Verify packages
        run: ./scripts/Test-Packages.ps1 -Version 0.0.0-dev

      - name: Open and save diagrams with both editor packages
        run: xvfb-run -a pwsh -NoProfile -File ./scripts/Test-Editors.ps1 -Version 0.0.0-dev

      - name: Test both editors with ApplicationVirtualPathFix
        if: ${{ inputs.with_virtual_path_fix }}
        run: xvfb-run -a pwsh -NoProfile -File ./scripts/Test-Editors.ps1 -Version 0.0.0-dev -WithApplicationVirtualPathFix

  # A workflow that runs for Dependabot gets a read-only token unless the job asks for more.
  dependabot:
    name: Merge Dependabot update
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: auroris/AurorisNet.Build/actions/dependabot-release@main
        with:
          shipped-projects: |
            src
            selfhosted
