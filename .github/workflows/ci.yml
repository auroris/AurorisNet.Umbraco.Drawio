name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      # Keep draw.io's line endings as JGraph publishes them; the Windows runner converts them by default.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      # The draw.io submodule comes at its pinned commit, with one commit of history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: true
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Test backoffice adapters
        run: node --test tests/backoffice/media-api.test.mjs

      - name: Test Umbraco 17.0.0
        run: dotnet test --project tests/AurorisNet.Umbraco.Drawio.Tests -c Release -p:UmbracoVersion=17.0.0

      - name: Test default Umbraco version
        run: dotnet test --project tests/AurorisNet.Umbraco.Drawio.Tests -c Release

      - name: Pack
        run: |
          foreach ($project in @('src/AurorisNet.Umbraco.Drawio.csproj', 'selfhosted/AurorisNet.Umbraco.Drawio.Selfhosted.csproj')) {
            dotnet pack $project -c Release -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { throw "Could not pack $project." }
          }

      - name: Verify packages
        run: ./scripts/Test-Packages.ps1 -Version 0.0.0-dev
