name: Release

run-name: Release ${{ inputs.version || format('(next {0})', inputs.bump) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, such as 1.2.3 or 1.2.3-rc.1 (optional v prefix). Leave blank to bump the newest stable tag.'
        required: false
        type: string
      bump:
        description: Which part of the newest stable tag to raise when the version is blank
        type: choice
        default: patch
        options:
          - patch
          - minor
      dry-run:
        description: Build, test and pack only, and keep the package as an artifact
        type: boolean
        default: false
      notes:
        description: Notes for the GitHub release, in Markdown, shown above the generated list of changes
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  PACKAGE_ID: AurorisNet.Umbraco.Drawio

jobs:
  release:
    name: Build and publish
    # Linux checks out draw.io's files with their own line endings, so the package carries them byte for byte.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      # Makes the build deterministic and, with Directory.Build.props, turns its warnings into errors.
      ContinuousIntegrationBuild: 'true'
    steps:
      # The draw.io submodule comes at its pinned commit, with one commit of history, as fetch-depth applies to it too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: true
          persist-credentials: false

      # global.json keeps the build on a .NET 10 SDK, whichever other SDKs the runner has.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Choose the version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUMP: ${{ inputs.bump || 'patch' }}
          RELEASE_COMMIT: ${{ github.sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # Read the tags from GitHub, which needs no history in the shallow checkout.
          $lines = @(git ls-remote --tags --refs $env:REPOSITORY_URL 'v*')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the release tags.' }
          $tags = @{}
          foreach ($line in $lines) {
            $sha, $ref = $line -split '\s+'
            $tags[$ref.Substring('refs/tags/'.Length)] = $sha
          }
          $version = $env:RELEASE_VERSION.Trim()
          if (-not $version) {
            $latest = $tags.Keys | Where-Object { $_ -cmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z' } |
              ForEach-Object { [version]$_.Substring(1) } | Sort-Object -Descending | Select-Object -First 1
            if (-not $latest) { throw 'No stable vMAJOR.MINOR.PATCH tag exists to bump. Enter a version, such as 1.0.0.' }
            $version = switch ($env:RELEASE_BUMP) {
              'minor' { "$($latest.Major).$($latest.Minor + 1).0" }
              'patch' { "$($latest.Major).$($latest.Minor).$($latest.Build + 1)" }
              default { throw "Unknown bump '$($env:RELEASE_BUMP)'. Use patch or minor." }
            }
            Write-Host "Raising the $env:RELEASE_BUMP number of v$latest to v$version."
          }
          if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          $number = '(0|[1-9][0-9]*)'
          $identifier = '(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ($version -cnotmatch "\A$number\.$number\.$number(-$identifier(\.$identifier)*)?\z") {
            throw 'Use MAJOR.MINOR.PATCH, optionally followed by a prerelease such as -rc.1. Build metadata is not supported.'
          }
          foreach ($component in $version.Split('-', 2)[0].Split('.')) {
            if ($component.Length -gt 5 -or [int]$component -gt 65534) { throw '.NET assembly version components must be between 0 and 65534.' }
          }
          $tag = "v$version"
          # A tag on this commit is a retry of the same release; a tag elsewhere belongs to another release.
          if ($tags.ContainsKey($tag) -and $tags[$tag] -ne $env:RELEASE_COMMIT) {
            throw "Tag $tag already marks commit $($tags[$tag]). Choose a new version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "tagged=$($tags.ContainsKey($tag).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --project tests/AurorisNet.Umbraco.Drawio.Tests -c Release

      - name: Pack
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          foreach ($project in @('src/AurorisNet.Umbraco.Drawio.csproj', 'selfhosted/AurorisNet.Umbraco.Drawio.Selfhosted.csproj')) {
            dotnet pack $project -c Release "-p:Version=$env:RELEASE_VERSION" -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { throw "Could not pack $project $env:RELEASE_VERSION." }
          }
          ./scripts/Test-Packages.ps1 -Version $env:RELEASE_VERSION

      # A dry run ends here, with the package a release of this commit would publish. Nothing is tagged or published.
      - name: Keep the package of a dry run
        if: ${{ inputs.dry-run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ github.run_id }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      # Reserve the tag before publishing, so a retried run finds it on this commit and reuses it.
      - name: Reserve the release tag
        if: ${{ !inputs.dry-run && steps.version.outputs.tagged != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:RELEASE_COMMIT" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not reserve the release tag $env:RELEASE_TAG." }

      - name: Log in to NuGet with trusted publishing
        if: ${{ !inputs.dry-run }}
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: AurorisNet

      - name: Publish to NuGet
        if: ${{ !inputs.dry-run }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          foreach ($id in @($env:PACKAGE_ID, "$env:PACKAGE_ID.Selfhosted")) {
            dotnet nuget push "artifacts/packages/$id.$env:RELEASE_VERSION.nupkg" `
              --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Could not publish $id $env:RELEASE_VERSION to NuGet." }
          }

      - name: Publish the GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          $packages = @("artifacts/packages/$env:PACKAGE_ID.$env:RELEASE_VERSION.nupkg",
            "artifacts/packages/$env:PACKAGE_ID.Selfhosted.$env:RELEASE_VERSION.nupkg")
          gh release view "$env:RELEASE_TAG" --json id 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" @packages --clobber
          } else {
            # Name the draw.io release the package carries, above any notes from the run.
            $drawio = (Get-Content external/drawio/VERSION -Raw).Trim()
            $commit = git -C external/drawio rev-parse HEAD
            $notes = "The Selfhosted package carries draw.io $drawio, commit [$($commit.Substring(0, 7))](https://github.com/jgraph/drawio/commit/$commit). The base package uses hosted diagrams.net."
            if ($env:RELEASE_NOTES) { $notes = "$notes`n`n$env:RELEASE_NOTES" }
            $notesFile = Join-Path $env:RUNNER_TEMP 'drawio-release-notes.md'
            Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8
            $create = @('release', 'create', $env:RELEASE_TAG) + $packages + @('--verify-tag', '--title', $env:RELEASE_VERSION,
              '--generate-notes', '--notes-file', $notesFile)
            if ($env:RELEASE_PRERELEASE -eq 'true') { $create += '--prerelease' }
            gh @create
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the GitHub release $env:RELEASE_TAG." }
