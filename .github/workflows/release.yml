name: Release

run-name: Release ${{ inputs.version || format('(next {0})', inputs.bump) }}${{ inputs.dry-run && ' (dry run)' || '' }}

# Publishes both packages to nuget.org and GitHub. Starts by hand, or from the Weekly release workflow
# when a new release of a dependency has been merged. The shared steps come from auroris/AurorisNet.Build, whose
# docs/releasing.md describes them. nuget.org trusts this file by its name, so keep it release.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, such as 1.2.3 or 1.2.3-rc.1. Leave empty to raise the newest release tag.
        required: false
        type: string
      bump:
        description: Which part of the newest stable tag to raise when the version is empty
        type: choice
        default: patch
        options:
          - patch
          - minor
      test:
        description: Run the tests before publishing.
        type: boolean
        default: true
      dry-run:
        description: Test and pack only, and keep the packages as an artifact
        type: boolean
        default: false
      notes:
        description: Notes for the GitHub release, in Markdown, shown above the generated list of changes
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  release:
    name: Test and publish
    # Linux checks out draw.io's files with their own line endings, so the package carries them byte for byte.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      # Makes the build deterministic and, with Directory.Build.props, turns its warnings into errors.
      ContinuousIntegrationBuild: 'true'
    steps:
      # The draw.io submodule comes at its pinned commit, with one commit of history, as fetch-depth applies to it too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: true
          persist-credentials: false

      # global.json keeps the build on a .NET 10 SDK, whichever other SDKs the runner has.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Choose the version
        id: version
        uses: auroris/AurorisNet.Build/actions/version@main
        with:
          version: ${{ inputs.version }}
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}

      # The site tests run on the newest supported Umbraco release. Other releases are tested on a developer's machine,
      # as the README's Developing section describes.
      - name: Test
        if: ${{ inputs.test }}
        run: |
          node --test "tests/backoffice/*.test.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'The backoffice adapter tests failed.' }
          dotnet test --project tests/AurorisNet.Umbraco.Drawio.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'The site tests failed.' }

      - name: Pack
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          foreach ($project in @('src/AurorisNet.Umbraco.Drawio.csproj', 'selfhosted/AurorisNet.Umbraco.Drawio.Selfhosted.csproj')) {
            dotnet pack $project -c Release "-p:Version=$env:RELEASE_VERSION" -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { throw "Could not pack $project $env:RELEASE_VERSION." }
          }
          ./scripts/Test-Packages.ps1 -Version $env:RELEASE_VERSION

      - name: Open and save diagrams with both editor packages
        if: ${{ inputs.test }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: xvfb-run -a pwsh -NoProfile -File ./scripts/Test-Editors.ps1 -Version $env:RELEASE_VERSION

      # Name the draw.io release the Selfhosted package carries, above any notes from the run.
      - name: Write the release notes
        id: notes
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          $drawio = (Get-Content external/drawio/VERSION -Raw).Trim()
          $commit = git -C external/drawio rev-parse HEAD
          $notes = "The Selfhosted package carries draw.io $drawio, commit [$($commit.Substring(0, 7))](https://github.com/jgraph/drawio/commit/$commit). The base package uses hosted diagrams.net."
          if ($env:RELEASE_NOTES) { $notes = "$notes`n`n$env:RELEASE_NOTES" }
          "notes<<END_OF_NOTES`n$notes`nEND_OF_NOTES" >> $env:GITHUB_OUTPUT

      - name: Publish
        uses: auroris/AurorisNet.Build/actions/publish@main
        with:
          versions: ${{ steps.version.outputs.versions }}
          dry-run: ${{ inputs.dry-run }}
          notes: ${{ steps.notes.outputs.notes }}
