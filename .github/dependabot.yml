# The workflows pin each action to a commit, which never moves on its own. Dependabot opens a pull request when an
# action publishes a newer release, and .github/workflows/ci.yml tests and merges it. The New Umbraco releases workflow
# follows Umbraco, the package's only shipped dependency.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
